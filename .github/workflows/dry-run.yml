name: Windows C crash diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-python3
            mingw-w64-clang-x86_64-ccache
            make git zip
      - name: Prepare private temp and crash diagnostics
        shell: pwsh
        run: |
          $root = & scripts/ci/new-protected-temp-root.ps1 -Prefix 'cbm-2946-diag-' -ProtectDir (Join-Path $env:GITHUB_WORKSPACE 'build\c')
          "CBM_CI_TEMP_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $dump = Join-Path $env:GITHUB_WORKSPACE 'diagnostics'
          $key = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\test-runner.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dump -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          Get-Item 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Format-List FullName
      - name: Build and reproduce the original suites
        shell: msys2 {0}
        run: |
          export TEMP="$(cygpath -m "$CBM_CI_TEMP_ROOT")"
          export TMP="$TEMP"
          export TMPDIR="$(cygpath -u "$CBM_CI_TEMP_ROOT")"
          printf "NATIVE_TOOL_BIN=%s\n" "$(cygpath -m /clang64/bin)" >> "$GITHUB_ENV"
          clang --version
          scripts/test.sh --suites extraction_inheritance,java_lsp_coverage,doc_links_md CC=clang CXX=clang++
      - name: Reproduce each crash site in a fresh native process
        if: always()
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'build\c\test-runner.exe'
          if (!(Test-Path $binary)) { throw 'Test executable was not built' }
          $env:PATH = "$env:NATIVE_TOOL_BIN;$env:PATH"
          $env:ASAN_OPTIONS = 'detect_stack_use_after_return=0'
          $env:TEMP = $env:CBM_CI_TEMP_ROOT
          $env:TMP = $env:CBM_CI_TEMP_ROOT
          $cases = @(@('extraction_inheritance','inherit_java'), @('java_lsp_coverage','cov_lit_int'), @('doc_links_md','doc_links_md_extract_tokens'))
          $processes = @()
          foreach ($case in $cases) {
            $env:CBM_TEST_ONLY = "$($case[0]):$($case[1])"
            $processes += Start-Process -FilePath $binary -ArgumentList $case[0] -PassThru -RedirectStandardOutput "diagnostics\$($case[0]).out" -RedirectStandardError "diagnostics\$($case[0]).err"
          }
          $failed = $false
          foreach ($process in $processes) {
            $process.WaitForExit()
            Write-Host "PID $($process.Id) exit $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Native crash-site reproduction failed; evidence retained' }
      - name: Capture native crash stack when debugger is available
        if: always()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (!(Test-Path $cdb)) { Write-Host 'CDB unavailable; retain WER dumps and suite logs'; exit 0 }
          $binary = Join-Path $env:GITHUB_WORKSPACE 'build\c\test-runner.exe'
          if (!(Test-Path $binary)) { throw 'Test executable was not built' }
          $env:PATH = "$env:NATIVE_TOOL_BIN;$env:PATH"
          $env:ASAN_OPTIONS = 'detect_stack_use_after_return=0'
          $cases = @(@('extraction_inheritance','inherit_java'), @('java_lsp_coverage','cov_lit_int'), @('doc_links_md','doc_links_md_extract_tokens'))
          foreach ($case in $cases) {
            $env:CBM_TEST_ONLY = "$($case[0]):$($case[1])"
            & $cdb -G -logo "diagnostics\$($case[0]).txt" -c 'sxd av; g; .ecxr; kv; r; lm; q' $binary $case[0]
          }
      - name: Retain failure evidence and exact native executable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-crash-evidence
          path: |
            diagnostics/
            build/c/test-logs/
            build/c/test-runner.exe
          retention-days: 7
